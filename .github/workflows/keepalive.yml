name: Keep workflows alive

on:
  schedule:
    - cron: '0 12 1 * *' # 1st of every month at noon UTC
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Re-enable disabled workflows
        run: |
          gh api repos/${{ github.repository }}/actions/workflows \
            --paginate -q '.workflows[] | select(.state == "disabled_inactivity") | .id' |
          while read -r wf_id; do
            echo "Re-enabling workflow $wf_id"
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf_id/enable"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit heartbeat
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/last-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive
          if ! git diff --cached --quiet; then
            git commit -m "chore: monthly keepalive heartbeat"
            git push
          fi
