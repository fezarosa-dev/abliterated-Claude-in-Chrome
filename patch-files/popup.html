<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
:root {
  --bg: hsl(48 33% 97%);
  --fg: #1a1a19;
  --fg2: #6b6b68;
  --accent: #c96442;
  --green: #4caf50;
  --border: #e0ddd5;
  --hover: #f5f0e8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: hsl(60 3% 15%);
    --fg: #e8e6df;
    --fg2: #a09f9a;
    --accent: #e07a54;
    --green: #66bb6a;
    --border: #3a3a37;
    --hover: #2a2a27;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 320px;
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--fg);
  padding: 16px;
}
h1 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
h1 span { color: var(--green); }
.site-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.site-row:last-child { border-bottom: none; }
.site-name {
  font-size: 13px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 200px;
}
.toggle {
  position: relative;
  width: 36px;
  height: 20px;
  cursor: pointer;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  inset: 0;
  background: #ccc;
  border-radius: 10px;
  transition: .2s;
}
.slider::before {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  left: 2px;
  bottom: 2px;
  background: white;
  border-radius: 50%;
  transition: .2s;
}
.toggle input:checked + .slider { background: var(--green); }
.toggle input:checked + .slider::before { transform: translateX(16px); }
.current {
  padding: 10px 12px;
  background: var(--hover);
  border-radius: 8px;
  margin-bottom: 12px;
}
.current-label { font-size: 11px; color: var(--fg2); text-transform: uppercase; letter-spacing: 0.5px; }
.current-host { font-size: 14px; font-weight: 600; margin-top: 2px; }
.status {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: 4px;
  display: inline-block;
  margin-top: 4px;
}
.status.allowed { background: #e8f5e9; color: #2e7d32; }
.status.blocked { background: #fbe9e7; color: #c62828; }
@media (prefers-color-scheme: dark) {
  .status.allowed { background: #1b3a1d; color: #81c784; }
  .status.blocked { background: #3e1a14; color: #ef9a9a; }
}
.section-title {
  font-size: 11px;
  color: var(--fg2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 12px 0 4px;
}
.empty { font-size: 12px; color: var(--fg2); padding: 8px 0; }
.remove-btn {
  background: none;
  border: none;
  color: var(--fg2);
  cursor: pointer;
  font-size: 16px;
  padding: 0 4px;
  line-height: 1;
}
.remove-btn:hover { color: var(--accent); }
.open-btn {
  width: 100%;
  padding: 8px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 12px;
}
.open-btn:hover { opacity: 0.9; }
</style>
</head>
<body>
<h1><span>&#x1F513;</span> Claude (Unblocked)</h1>

<button class="open-btn" id="open-panel">Open Side Panel</button>

<div class="current" id="current-site"></div>

<div class="section-title">Blocked sites (use original restrictions)</div>
<div id="blocked-list"></div>

<script src="popup.js"></script>
</body>
</html>
